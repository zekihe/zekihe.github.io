<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>日语期末复习</title>
<style>
:root{
  --bg:#f6f4ee; --card:#fff; --ink:#23211c; --sub:#8a8a82;
  --line:#e7e3d8; --accent:#c0392b; --accent2:#2e7d6b;
  --mask:#e9e5da; --jp:#1b1b1b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,"PingFang SC","Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
  font-size:18px;line-height:1.7;-webkit-text-size-adjust:100%;}
body{padding-bottom:40px;}

/* 顶栏 */
header{position:sticky;top:0;z-index:30;background:rgba(246,244,238,.96);
  backdrop-filter:saturate(1.2) blur(6px);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top,0) + 8px) 10px 8px;}
.htitle{font-size:15px;font-weight:700;text-align:center;letter-spacing:.5px;margin-bottom:8px;color:#444;}
.toggles{display:flex;gap:6px;justify-content:center;margin-bottom:8px;}
.tg{flex:1;max-width:120px;border:1px solid var(--line);background:var(--card);
  border-radius:999px;padding:8px 4px;font-size:13px;font-weight:600;color:#555;text-align:center;}
.tg.on{background:var(--accent);color:#fff;border-color:var(--accent);}
.tg.on.kanatog{background:var(--accent2);border-color:var(--accent2);}
.search{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;
  padding:9px 12px;font-size:15px;outline:none;}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 2px 2px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:8px;
  padding:6px 0;font-size:14px;font-weight:600;color:#555;white-space:nowrap;
  position:relative;min-width:38px;text-align:center;}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink);}
.tab.key{background:#fdf6e3;border-color:#e8d28a;}
.tab.key.on{background:var(--ink);border-color:var(--ink);}
.tab .star{position:absolute;bottom:1px;right:3px;color:#e2a400;font-size:9px;line-height:1;}
.tab.done::after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;
  border-radius:50%;background:var(--accent2);}
.tab.on.done::after{background:#8fe3cf;}
.reset-tab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;
  padding:8px 12px;font-size:13px;font-weight:600;color:#999;white-space:nowrap;}

main{padding:12px 10px 0;max-width:680px;margin:0 auto;}

.lesson-head{margin:6px 2px 12px;}
.lesson-head .unit{font-size:12px;color:#999;font-weight:600;}
.lesson-head .ttl{font-size:23px;font-weight:800;margin-top:2px;line-height:1.35;}
.lesson-head .sub{font-size:14px;color:#888;margin-top:2px;}
.keybadge{display:inline-block;background:#e2a400;color:#fff;font-size:11px;font-weight:800;
  border-radius:6px;padding:2px 8px;margin-bottom:6px;letter-spacing:.5px;
  box-shadow:0 1px 3px rgba(226,164,0,.35);}

.sec{margin-bottom:18px;}
.sec-h{font-size:15.5px;font-weight:700;color:var(--accent);letter-spacing:.5px;
  margin:0 2px 8px;display:flex;align-items:center;gap:6px;}
.sec-h::before{content:"";width:4px;height:15px;background:var(--accent);border-radius:2px;}
.sec-h.g::before{background:var(--accent2);}
.sec-h.g{color:var(--accent2);}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:13px 14px;margin-bottom:9px;box-shadow:0 1px 2px rgba(0,0,0,.03);}
.jp{font-size:20px;color:var(--jp);line-height:1.95;}
.cn{font-size:17px;color:#5a574e;margin-top:6px;}

/* 假名 */
.kana{color:#2e7d6b;font-size:.82em;font-weight:600;}
body.hidekana .kana{background:transparent;color:transparent;cursor:pointer;
  border-bottom:2px solid #cdc4ad;border-radius:0;padding:0 1px;}
body.hidekana .kana.show{border-bottom:none;color:#236657;font-size:.95em;font-weight:700;}

/* 中文遮罩 */
.cn .t,.trans .t,.wcn .t{transition:background .15s,border-color .15s;}
body.hidecn .cn .t,body.hidecn .trans .t,body.hidecn .wcn .t{
  background:rgba(46,125,107,.05);color:transparent;border-radius:4px;cursor:pointer;
  border-bottom:1px dashed #b3c5be;box-shadow:none;}
body.hidecn .cn.show .t,body.hidecn .trans.show .t,body.hidecn .wcn.show .t{
  background:none;color:inherit;border-bottom-color:transparent;}

/* 应用课文 */
.dlg{margin:3px 0;font-size:20px;line-height:1.9;}
.dlg .role{color:#b08;font-weight:700;}
.trans{font-size:15.5px;color:#5a574e;margin-top:7px;padding-top:7px;border-top:1px dashed var(--line);}
.alabel{display:inline-block;background:var(--accent2);color:#fff;font-size:12px;font-weight:700;
  border-radius:6px;padding:1px 8px;margin-bottom:6px;}

/* 生词 */
.wlist{display:grid;grid-template-columns:1fr;gap:0;}
.wrow{display:flex;align-items:baseline;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);}
.wrow:last-child{border-bottom:none;}
.wword{font-size:18.5px;font-weight:700;min-width:0;flex:0 0 auto;max-width:42%;}
.wread{font-size:13.5px;color:var(--accent2);flex:0 0 auto;}
body.hidekana .wread{background:transparent;color:transparent;border-bottom:1px dashed #cdc4ad;border-radius:0;padding:0 2px;cursor:pointer;}
body.hidekana .wread.show{background:none;color:var(--accent2);}
.wcn{margin-left:auto;font-size:15.5px;color:#5a574e;text-align:right;}
.whit{background:#fff6c8;}

/* 语法 */
.glist{padding-left:2px;}
.gitem{background:#fbfbf8;border-left:3px solid var(--accent2);border-radius:0 8px 8px 0;
  padding:8px 11px;margin-bottom:7px;font-size:16px;line-height:1.7;color:#3a382f;}
.gitem b,.gitem strong{color:var(--accent2);}

.hint{text-align:center;color:#aaa;font-size:12px;margin:14px 0 4px;}
mark{background:#fff2a8;color:inherit;padding:0 1px;border-radius:3px;}
</style>
</head>
<body class="hidecn hidekana">

<header>
  <div class="htitle">📘 新标日初级上 · 期末复习（1～12课）<br><span style="font-size:11px;font-weight:600;color:#e2a400;">★ 考试重点：第 5～12 课</span></div>
  <div class="toggles">
    <div class="tg on" id="tCn">隐藏中文</div>
    <div class="tg on kanatog" id="tKana">隐藏假名</div>
    <div class="reset-tab" id="resetBtn">↺ 重置</div>
  </div>
  <input class="search" id="search" placeholder="🔍 搜生词（日文/读音/中文）…" autocomplete="off">
  <div class="tabs" id="tabs"></div>
</header>

<main id="main"></main>
<div class="hint" id="hint">点被遮住的部分可单独显示答案 · 再点收起</div>

<script>
const DATA = {"lessons": [{"no": "第1课", "unit": "第1单元 小李在日", "title": "李さんは中国人です（小李是中国人）", "sub": "小李是中国人", "basic": [{"jp": "李（リー）さんは　中国人（ちゅうごくじん）です。", "cn": "小李是中国人。"}, {"jp": "森（もり）さんは　学生（がくせい）では　ありません。", "cn": "森先生不是学生。"}, {"jp": "林（はやし）さんは　日本人（にほんじん）ですか。", "cn": "林先生是日本人吗？"}, {"jp": "李（リー）さんは　ＪＣ企画（きかく）の　社員（しゃいん）です。", "cn": "小李是JC策划公司的职员。"}], "apply": [{"label": "A", "dialog": ["甲：わたしは　森（もり）です。小野（おの）さんですか。", "乙：はい、そうです。小野です。"], "trans": "我姓森，您是小野女士吗？／是的，我是小野。"}, {"label": "B", "dialog": ["甲：森さんは　学生（がくせい）ですか。", "乙：いいえ、学生では　ありません。会社員（かいしゃいん）です。"], "trans": "森先生是学生吗？／不，不是学生，是公司职员。"}, {"label": "C", "dialog": ["甲：吉田（よしだ）さんですか。", "乙：いいえ、ちがいます。森です。"], "trans": "您是吉田先生吗？／不，不是，我是森。"}, {"label": "D", "dialog": ["甲：李さんは　ＪＣ企画（きかく）の　社員（しゃいん）ですか。", "乙：はい、そうです。"], "trans": "小李是JC策划公司的职员吗？／是的。"}], "words": [{"word": "ＪＣ企画", "read": "ジェーシーきかく", "cn": "JC策划（公司名）"}, {"word": "社員", "read": "しゃいん", "cn": "职员"}, {"word": "わたし", "read": "—", "cn": "我"}, {"word": "はい", "read": "—", "cn": "是"}, {"word": "そうです", "read": "—", "cn": "是的"}, {"word": "いいえ", "read": "—", "cn": "不是"}, {"word": "～さん", "read": "—", "cn": "～先生／女士"}], "grammar": ["**～は～です**：肯定判断「～是～」", "**～は～では ありません**：否定「～不是～」（口语 `じゃ ありません`）", "**～は～ですか**：疑问「～是～吗？」", "**の**：领属／所属「～的」（ＪＣ企画の社員）"]}, {"no": "第2课", "unit": "第1单元 小李在日", "title": "これは本です（这是书）", "sub": "这是书", "basic": [{"jp": "これは　本（ほん）です。", "cn": "这是书。"}, {"jp": "それは　何（なん）ですか。", "cn": "那是什么？"}, {"jp": "あれは　だれの　傘（かさ）ですか。", "cn": "那是谁的伞？"}, {"jp": "この　カメラは　スミスさんのです。", "cn": "这个相机是史密斯先生的。"}], "apply": [{"label": "A", "dialog": ["甲：これは　テレビですか。", "乙：いいえ、それは　テレビでは　ありません。パソコンです。"], "trans": "这是电视机吗？／不，那不是电视机，是个人电脑。"}, {"label": "B", "dialog": ["甲：これは　何（なん）ですか。", "乙：これは　日本語（にほんご）の　本（ほん）です。"], "trans": "这是什么？／这是日语书。"}, {"label": "C", "dialog": ["甲：森（もり）さんの　かばんは　どれですか。", "乙：あの　かばんです。"], "trans": "森先生的包是哪个？／是那个包。"}, {"label": "D", "dialog": ["甲：その　ノートは　だれのですか。", "乙：わたしのです。"], "trans": "那个笔记本是谁的？／是我的。"}], "words": [{"word": "これ／この", "read": "—", "cn": "这（个）"}, {"word": "それ／その", "r "远的"}, {"word": "いい／よい", "read": "—", "cn": "好的"}, {"word": "おいしい", "read": "—", "cn": "好吃的"}, {"word": "あまり", "read": "—", "cn": "（不）太～"}, {"word": "とても", "read": "—", "cn": "非常"}], "grammar": ["**～いです**：现在肯定「（很）～」（辛いです）", "**～くないです**：现在否定「不～」（熱く ないです）", "**～かったです**：过去肯定「（曾）～」（楽しかったです）", "**～くなかったです**：过去否定「（曾）不～」（よくなかったです）", "特殊：いい → よい → よくない／よかった", "**い形容词＋名词**：直接修饰（広い国）", "**あまり＋否定**：「不太～」"]}, {"no": "第10课", "unit": "第3单元 小李在箱根", "title": "京都の紅葉は有名です（京都的红叶很有名）", "sub": "京都的红叶很有名", "basic": [{"jp": "京都（きょうと）の　紅葉（こうよう）は　有名（ゆうめい）です。", "cn": "京都的红叶很有名。"}, {"jp": "この　通（とお）りは　にぎやかでは　ありません。", "cn": "这条街道不热闹。"}, {"jp": "奈良（なら）は　静（しず）かな　町（まち）です。", "cn": "奈良是个安静的城市。"}, {"jp": "昨日（きのう）は　日曜日（にちようび）でした。", "cn": "昨天是星期天。"}], "apply": [{"label": "A", "dialog": ["甲：どんな　お土産（みやげ）を　買（か）いましたか。", "乙：きれいな　人形（にんぎょう）を　買（か）いました。"], "trans": "买了什么样的礼物？／买了漂亮的人偶。"}, {"label": "B", "dialog": ["甲：京都（きょうと）は　どうでしたか。", "乙：とても　きれいでした。でも、静（しず）かでは　ありませんでした。"], "trans": "京都怎么样？／非常漂亮。不过，并不安静。"}, {"label": "C", "dialog": ["甲：横浜（よこはま）は　どんな　町（まち）ですか。", "乙：大（おお）きい　町（まち）です。そして、にぎやかな　町（まち）です。"], "trans": "横滨是个什么样的城市？／是个大城市。而且，是个热闹的城市。"}, {"label": "D", "dialog": ["甲：東京（とうきょう）の　天気（てんき）は　どうでしたか。", "乙：昨日（きのう）は　晴（は）れでした。でも、おとといは　雨（あめ）でした。"], "trans": "东京的天气怎么样？／昨天是晴天。不过，前天是雨天。"}], "words": [{"word": "紅葉", "read": "こうよう", "cn": "红叶"}, {"word": "通り", "read": "とおり", "cn": "街道、马路"}, {"word": "町", "read": "まち", "cn": "城市、街道"}, {"word": "人形", "read": "にんぎょう", "cn": "人偶、玩偶"}, {"word": "晴れ", "read": "はれ", "cn": "晴天"}, {"word": "雨", "read": "あめ", "cn": "雨"}, {"word": "おととい", "read": "—", "cn": "前天"}, {"word": "有名（な）", "read": "ゆうめい", "cn": "有名的"}, {"word": "にぎやか（な）", "read": "—", "cn": "热闹的"}, {"word": "静か（な）", "read": "しずか", "cn": "安静的"}, {"word": "きれい（な）", "read": "—", "cn": "漂亮的、干净的"}, {"word": "大きい", "read": "おおきい", "cn": "大的"}, {"word": "どんな", "read": "—", "cn": "什么样的"}, {"word": "どう", "read": "—", "cn": "怎么样"}, {"word": "そして", "read": "—", "cn": "而且、然后"}, {"word": "でも", "read": "—", "cn": "但是"}], "grammar": ["**～です**：现在肯定「（很）～」（有名です）", "**～では ありません**：现在否定「不～」（にぎやかでは ありません）", "**～でした**：过去肯定（晴れでした／きれいでした）", "**～では ありませんでした**：过去否定（静かでは ありませんでした）", "**な形容词＋な＋名词**：修饰名词需加 な（静かな町、きれいな人形）", "**どんな＋名词**：「什么样的～」", "**名词谓语**也同此变化（日曜日でした＝（曾）是星期天）"]}, {"no": "第11课", "unit": "第3单元 小李在箱根", "title": "小野さんは歌が好きです（小野女士喜欢唱歌）", "sub": "小野女士喜欢唱歌", "basic": [{"jp": "小野（おの）さんは　歌（うた）が　好（す）きです。", "cn": "小野女士喜欢唱歌。"}, {"jp": "スミスさんは　韓国語（かんこくご）が　分（わ）かります。", "cn": "史密斯先生懂韩语。"}, {"jp": "吉田（よしだ）さんは　中国（ちゅうごく）へ　来（き）たいです。", "cn": "吉田先生想来中国。"}, {"jp": "森（もり）さんは　お酒（さけ）が　好（す）きですから、毎日（まいにち）　飲（の）みます。", "cn": "森先生喜欢喝酒，所以每天都喝。"}], "apply": [{"label": "A", "dialog": ["甲：吉田（よしだ）さんは　料理（りょうり）が　できますか。", "乙：いいえ、全然（ぜんぜん）　できません。"], "trans": "吉田先生会做菜吗？／不，完全不会。"}, {"label": "B", "dialog": ["甲：どんな　音楽（おんがく）が　好（す）きですか。", "乙：ロックや　ポップスが　好（す）きです。"], "trans": "喜欢什么样的音乐？／喜欢摇滚和流行音乐。"}, {"label": "C", "dialog": ["甲：李（リー）さん、スペイン語（ご）が　分（わ）かりますか。", "乙：ええ、大学（だいがく）で　習（なら）いましたから、少（すこ）し　分（わ）かります。"], "trans": "小李，懂西班牙语吗？／嗯，在大学学过，所以懂一点。"}, {"label": "D", "dialog": ["甲：小野（おの）さん、よく　音楽（おんがく）を　聞（き）きますか。", "乙：ええ、家（うち）で　ＣＤを　よく　聞（き）きます。そして、時々（ときどき）　コンサートへ　行（い）きます。"], "trans": "小野女士，经常听音乐吗？／嗯，常在家听CD。而且，偶尔去音乐会。"}], "words": [{"word": "歌", "read": "うた", "cn": "歌"}, {"word": "お酒", "read": "おさけ", "cn": "酒"}, {"word": "韓国語", "read": "かんこくご", "cn": "韩语"}, {"word": "スペイン語", "read": "スペインご", "cn": "西班牙语"}, {"word": "料理", "read": "りょうり", "cn": "菜、烹饪"}, {"word": "音楽", "read": "おんがく", "cn": "音乐"}, {"word": "ロック", "read": "—", "cn": "摇滚乐"}, {"word": "ポップス", "read": "—", "cn": "流行音乐"}, {"word": "コンサート", "read": "—", "cn": "音乐会"}, {"word": "好き（な）", "read": "すき", "cn": "喜欢"}, {"word": "分かります", "read": "わかります", "cn": "懂、明白"}, {"word": "できます", "read": "—", "cn": "会、能"}, {"word": "習います", "read": "ならいます", "cn": "学习"}, {"word": "聞きます", "read": "ききます", "cn": "听、问"}, {"word": "全然", "read": "ぜんぜん", "cn": "完全（+否定）"}, {"word": "少し", "read": "すこし", "cn": "一点"}, {"word": "よく", "read": "—", "cn": "经常"}, {"word": "時々", "read": "ときどき", "cn": "偶尔"}, {"word": "～から", "read": "—", "cn": "因为～（接续助词）"}], "grammar": ["**～が　好き／嫌い／上手／下手**：好恶能力用 が（歌が好きです）", "**～が　分かります／できます**：「懂～／会～」对象用 が", "**动词ます形去ます＋たいです**：愿望「想做～」（来たいです、たい对象可用 が/を）", "**～から**：原因理由「因为～，所以～」（好きですから）", "**AやB**：列举「A啊B啊（之类）」（ロックやポップス）"]}, {"no": "第12课", "unit": "第3单元 小李在箱根", "title": "李さんは森さんより若いです（小李比森先生年轻）", "sub": "小李比森先生年轻", "basic": [{"jp": "李（リー）さんは　森（もり）さんより　若（わか）いです。", "cn": "小李比森先生年轻。"}, {"jp": "日本（にほん）より　中国（ちゅうごく）の　ほうが　広（ひろ）いです。", "cn": "中国比日本辽阔。"}, {"jp": "神戸（こうべ）は　奈良（なら）より　にぎやかでは　ありません。", "cn": "神户没有奈良热闹。"}, {"jp": "スポーツの　中（なか）で　サッカーが　いちばん　おもしろいです。", "cn": "在体育运动中足球最有趣。"}], "apply": [{"label": "A", "dialog": ["甲：北京（ペキン）は　東京（とうきょう）より　寒（さむ）いですか。", "乙：ええ、冬（ふゆ）の　北京（ペキン）は　東京（とうきょう）より　ずっと　寒（さむ）いです。"], "trans": "北京比东京冷吗？／嗯，冬天的北京比东京冷得多。"}, {"label": "B", "dialog": ["甲：日本語（にほんご）と　英語（えいご）と　どちらが　難（むずか）しいですか。", "乙：日本語（にほんご）の　ほうが　難（むずか）しいです。"], "trans": "日语和英语哪个难？／日语更难。"}, {"label": "C", "dialog": ["甲：森（もり）さんは　テニスが　上手（じょうず）ですね。", "乙：いいえ、長島（ながしま）さんほど　上手（じょうず）では　ありません。"], "trans": "森先生网球打得真好啊。／不，没有长岛先生打得好。"}, {"label": "D", "dialog": ["甲：季節（きせつ）の　中（なか）で　いつが　いちばん　好（す）きですか。", "乙：わたしは　春（はる）が　いちばん　好（す）きです。"], "trans": "四季当中最喜欢什么时候？／我最喜欢春天。"}], "words": [{"word": "サッカー", "read": "—", "cn": "足球"}, {"word": "スポーツ", "read": "—", "cn": "体育运动"}, {"word": "季節", "read": "きせつ", "cn": "季节"}, {"word": "冬", "read": "ふゆ", "cn": "冬天"}, {"word": "春", "read": "はる", "cn": "春天"}, {"word": "英語", "read": "えいご", "cn": "英语"}, {"word": "テニス", "read": "—", "cn": "网球"}, {"word": "若い", "read": "わかい", "cn": "年轻的"}, {"word": "寒い", "read": "さむい", "cn": "寒冷的"}, {"word": "難しい", "read": "むずかしい", "cn": "难的"}, {"word": "おもしろい", "read": "—", "cn": "有趣的"}, {"word": "上手（な）", "read": "じょうず", "cn": "（某方面）擅长"}, {"word": "いちばん", "read": "—", "cn": "最"}, {"word": "ずっと", "read": "—", "cn": "～得多"}, {"word": "どちら", "read": "—", "cn": "哪个（两者间）"}], "grammar": ["**AはBより～**：「A比B更～」（李さんは森さんより若い）", "**BよりAのほうが～**：「比起B，A更～」（中国のほうが広い）", "**AはBほど～ない**：「A没有B那么～」（長島さんほど上手ではない）", "**AとBと　どちらが～**：「A和B哪个更～」", "**～の中で　～が　いちばん～**：「在～当中，～最～」（最高级）"]}]};
const STAR = {7:1,8:1,9:1,10:1,11:1,12:1,5:1,6:1}; // 第2、3单元重点
let cur = 0;
let DONE = new Set();
try{ DONE = new Set(JSON.parse(localStorage.getItem('jp_done')||'[]')); }catch(e){}

// 把 日文（かな） 切成片段，括号读音包成 .kana
function renderJP(s){
  let out='', i=0;
  while(i<s.length){
    const o=s.indexOf('（',i);
    if(o<0){out+=esc(s.slice(i));break;}
    out+=esc(s.slice(i,o));
    const c=s.indexOf('）',o);
    if(c<0){out+=esc(s.slice(o));break;}
    out+='<span class="kana">'+esc(s.slice(o,c+1))+'</span>';
    i=c+1;
  }
  return out;
}
function esc(t){return t.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}
function cnSpan(t,cls){return '<span class="'+cls+'"><span class="t">'+esc(t)+'</span></span>';}

function renderLesson(idx){
  const L=DATA.lessons[idx];
  let h='';
  h+='<div class="lesson-head"><div class="unit">'+esc(L.unit)+'</div>'+
     (STAR[idx+1]?'<div class="keybadge">★ 考试重点</div>':'')+
     '<div class="ttl">'+esc(L.no)+'　'+renderJP(L.title.split('（')[0])+'</div>'+
     '<div class="sub">'+esc(L.sub)+'</div></div>';

  // 基本课文
  h+='<div class="sec"><div class="sec-h">基本课文</div>';
  L.basic.forEach(b=>{
    h+='<div class="card"><div class="jp">'+renderJP(b.jp)+'</div>'+
       '<div class="cn">'+cnSpanInner(b.cn)+'</div></div>';
  });
  h+='</div>';

  // 应用课文
  h+='<div class="sec"><div class="sec-h">应用课文</div>';
  L.apply.forEach(a=>{
    h+='<div class="card"><span class="alabel">'+esc(a.label)+'</span>';
    a.dialog.forEach(d=>{
      const m=d.match(/^([甲乙])：(.*)$/);
      if(m) h+='<div class="dlg"><span class="role">'+m[1]+'：</span>'+renderJP(m[2])+'</div>';
      else h+='<div class="dlg">'+renderJP(d)+'</div>';
    });
    h+='<div class="trans"><span class="t">'+esc(a.trans)+'</span></div></div>';
  });
  h+='</div>';

  // 生词
  h+='<div class="sec"><div class="sec-h">生词</div><div class="card"><div class="wlist">';
  L.words.forEach(w=>{
    const read = (w.read==='—'||w.read==='')?'<span class="wread" style="opacity:.25">—</span>'
                 :'<span class="wread">'+esc(w.read)+'</span>';
    h+='<div class="wrow" data-w="'+esc((w.word+w.read+w.cn).toLowerCase())+'">'+
       '<span class="wword">'+esc(w.word)+'</span>'+read+
       '<span class="wcn"><span class="t">'+esc(w.cn)+'</span></span></div>';
  });
  h+='</div></div></div>';

  // 语法
  h+='<div class="sec"><div class="sec-h g">核心语法</div><div class="glist">';
  L.grammar.forEach(g=>{
    h+='<div class="gitem">'+mdBold(g)+'</div>';
  });
  h+='</div></div>';

  return h;
}
function cnSpanInner(t){return '<span class="t">'+esc(t)+'</span>';}
function mdBold(s){
  // **x** -> <b>x</b>，保留 <br>
  let e=s.replace(/&/g,'&amp;').replace(/</g,'＜').replace(/>/g,'＞');
  e=e.replace(/＜br＞/g,'<br>');
  return e.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`(.+?)`/g,'<code>$1</code>');
}

function buildTabs(){
  let h='';
  DATA.lessons.forEach((L,i)=>{
    const n=i+1;
    h+='<div class="tab'+(STAR[n]?' key':'')+(DONE.has(i)?' done':'')+'" data-i="'+i+'">'+n+(STAR[n]?'<span class="star">★</span>':'')+'</div>';
  });
  document.getElementById('tabs').innerHTML=h;
}

function markDone(idx){
  if(DONE.has(idx)) return;
  DONE.add(idx);
  try{localStorage.setItem('jp_done',JSON.stringify([...DONE]));}catch(e){}
}

function show(idx){
  cur=idx;
  document.getElementById('main').innerHTML=renderLesson(idx);
  markDone(idx);
  document.querySelectorAll('.tab').forEach((t,i)=>{
    t.classList.toggle('on',i===idx);
    t.classList.toggle('done',DONE.has(i));
  });
  const at=document.querySelector('.tab.on');
  if(at) at.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
  window.scrollTo(0,0);
}

// 事件
document.getElementById('tabs').addEventListener('click',e=>{
  const t=e.target.closest('.tab'); if(t) show(+t.dataset.i);
});
document.getElementById('resetBtn').addEventListener('click',()=>{
  if(confirm('确定清空所有「已看」进度标记吗？')){
    DONE=new Set();
    try{localStorage.removeItem('jp_done');}catch(e){}
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('done'));
    markDone(cur);
    const ct=document.querySelector('.tab[data-i="'+cur+'"]');
    if(ct) ct.classList.add('done');
  }
});
document.getElementById('tCn').addEventListener('click',function(){
  document.body.classList.toggle('hidecn');
  this.classList.toggle('on',document.body.classList.contains('hidecn'));
});
document.getElementById('tKana').addEventListener('click',function(){
  document.body.classList.toggle('hidekana');
  this.classList.toggle('on',document.body.classList.contains('hidekana'));
});
// 点遮罩单独显示
document.getElementById('main').addEventListener('click',e=>{
  const k=e.target.closest('.kana,.wread');
  if(k && document.body.classList.contains('hidekana')){k.classList.toggle('show');return;}
  const c=e.target.closest('.cn,.trans,.wcn');
  if(c && document.body.classList.contains('hidecn')){c.classList.toggle('show');}
});
// 搜索
document.getElementById('search').addEventListener('input',function(){
  const q=this.value.trim().toLowerCase();
  document.querySelectorAll('.wrow').forEach(r=>{
    const hit=q && r.dataset.w.includes(q);
    r.style.background = hit?'#fff6c8':'';
  });
  if(q){
    const first=[...document.querySelectorAll('.wrow')].find(r=>r.dataset.w.includes(q));
    if(first) first.scrollIntoView({block:'center',behavior:'smooth'});
  }
});

buildTabs();
show(0);
</script>
</body>
